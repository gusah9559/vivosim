[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vivosim"
version = "0.0.1"
description = "Physiologically based pharmacokinetic (PBPK) simulation for preclinical species"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "gusah9559" }]
keywords = ["pbpk", "pharmacokinetics", "in-silico", "simulation", "preclinical"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Reading molecular structures (SMILES -> logP, descriptors).
chem = ["rdkit>=2023.9"]
# Opening the viewer in a native window instead of a browser tab.
app = ["pywebview>=4.4"]
dev = ["pytest>=7.4", "ruff>=0.5", "rdkit>=2023.9"]

[project.urls]
Homepage = "https://github.com/gusah9559/vivosim"
Issues = "https://github.com/gusah9559/vivosim/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vivosim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
